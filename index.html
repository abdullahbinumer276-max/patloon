    <script>
      // Defensive window.fetch property shim to prevent "Cannot set property fetch of #<Window> which has only a getter"
      try {
        let _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _currentFetch;
          },
          set(val) {
            _currentFetch = typeof val === 'function' ? val.bind(window) : val;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // Silently continue if window is already locked
      }
    </script>
